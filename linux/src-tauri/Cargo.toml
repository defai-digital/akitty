[package]
name = "akitty-linux-experimental"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false
default-run = "akitty-linux-experimental"

[workspace]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build"]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
akitty-agent-core = { path = "../../crates/akitty-agent-core", version = "=1.3.3" }
base64 = "=0.22.1"
libc = "=0.2.177"
portable-pty = "=0.9.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
unicode-general-category = "=1.1.0"
vte = { path = "../../third_party/vte", version = "=0.15.0" }
tauri = { version = "=2.12.5", optional = true }

[build-dependencies]
tauri-build = { version = "=2.7.4", optional = true }

[[bin]]
name = "akitty-linux-experimental"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "akitty-agent"
path = "src/bin/akitty-agent.rs"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Memory", "Win32_System_Pipes", "Win32_System_Threading"] }

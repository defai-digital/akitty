name: Verify macOS
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  required:
    name: Required macOS verification
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component clippy --component rustfmt --target wasm32-unknown-unknown
      - name: Verify Rust, TypeScript, Swift, C ABI and public files
        run: scripts/verify.sh
      - name: Shell hooks with current bash (macOS ships 3.2)
        run: |
          brew install bash
          AKITTY_TEST_BASH="$(brew --prefix)/bin/bash" python3 scripts/test_shell_integration.py
      - name: Build app bundle
        run: scripts/build-app.sh release
      - name: Check generated TypeScript bundle is current
        run: git diff --exit-code -- macos/Sources/AkittyKit/Resources/features.js
      - name: Retain Native and WASM benchmark smoke evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-wasm-benchmark-smoke
          path: build/quality-smoke.*/benchmark.json
          if-no-files-found: ignore
      - name: Retain macOS browser failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-browser-failure
          path: |
            packages/akitty-web/test-results/
            packages/akitty-web/playwright-report/
          if-no-files-found: ignore

  shell-hooks:
    # macOS /bin/bash is 3.2, which runs only the first PROMPT_COMMAND element; array hooks need bash 5.1 or later.
    name: Shell hooks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04] # bash 5.1, 5.2
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update -q && sudo apt-get install -y -q zsh
      - run: bash --version | head -1 && AKITTY_TEST_ZSH=/usr/bin/zsh python3 scripts/test_shell_integration.py

  browser-platforms:
    name: Browser terminal (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/akitty-web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:browser
      - name: Retain browser failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-terminal-${{ matrix.os }}-failure
          path: |
            packages/akitty-web/test-results/
            packages/akitty-web/playwright-report/
          if-no-files-found: ignore

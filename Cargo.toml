[workspace]
members = ["crates/akitty-agent-core", "crates/akitty-core", "crates/akitty-vt"]
default-members = ["crates/akitty-core"]
resolver = "2"

[workspace.package]
version = "1.3.19"
edition = "2024"
license = "MIT"
rust-version = "1.99"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "unwind"

[workspace]
members = ["crates/akitty-agent-core", "crates/akitty-core", "third_party/alacritty_terminal", "third_party/vte"]
default-members = ["crates/akitty-core"]
exclude = ["linux/src-tauri", "windows/src-tauri"]
resolver = "2"

[workspace.package]
version = "1.3.5"
edition = "2024"
license = "MIT"
rust-version = "1.99"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "unwind"

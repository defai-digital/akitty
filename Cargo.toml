[workspace]
members = ["crates/akitty-core", "third_party/alacritty_terminal", "third_party/vte"]
default-members = ["crates/akitty-core"]
resolver = "2"

[workspace.package]
version = "1.1.2"
edition = "2024"
license = "MIT"
rust-version = "1.99"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "unwind"

[package]
name = "akitty-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
akitty-agent-core = { path = "../akitty-agent-core", version = "=1.3.17" }
akitty-vt = { path = "../akitty-vt", version = "=1.3.17" }
portable-pty = "=0.9.0"
libc = "=0.2.177"
base64 = "=0.22.1"
miniz_oxide = "=0.8.9"
png = { version = "=0.18.1", default-features = false }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
unicode-width = "=0.2.3"

[dev-dependencies]
base64 = "=0.22.1"
miniz_oxide = "=0.8.9"
png = { version = "=0.18.1", default-features = false }

[package]
name = "akitty-windows-experimental"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false
default-run = "akitty-windows-experimental"

[workspace]

[features]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
akitty-linux-experimental = { path = "../../linux/src-tauri", version = "=0.1.0", default-features = false }
serde_json = "=1.0.145"
tauri = { version = "=2.12.5", features = [] }

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[[bin]]
name = "akitty-agent"
path = "../../linux/src-tauri/src/bin/akitty-agent.rs"
